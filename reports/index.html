<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>🚀 CI/CD Dashboard</title>

    <!-- 🔥 FIX: base path for GitHub Pages -->
    <base href="/fastapi-app/">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 34px;
            margin: 0;
        }

        p {
            color: #94a3b8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
        }

        .status {
            font-weight: bold;
            margin: 10px 0;
        }

        .success { color: #22c55e; }
        .warning { color: #f59e0b; }
        .danger { color: #ef4444; }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background: #2563eb;
            border-radius: 6px;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            margin: 30px 0;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 CI/CD Dashboard</h1>
    <p id="lastUpdated">Loading...</p>
</header>

<div class="grid">

    <!-- Test -->
    <div class="card">
        <h3>🧪 Test Report</h3>
        <div id="testStatus" class="status">Loading...</div>
        <a href="test-report/report.html">View Report</a>
    </div>

    <!-- Coverage -->
    <div class="card">
        <h3>📊 Coverage</h3>
        <div id="coverageStatus" class="status">Loading...</div>
        <a href="test-report/htmlcov/index.html">View Coverage</a>
    </div>

    <!-- Lint -->
    <div class="card">
        <h3>🧹 Lint</h3>
        <div id="lintStatus" class="status">Loading...</div>
        <a href="lint-report/index.html">View Report</a>
    </div>

    <!-- Security -->
    <div class="card">
        <h3>🔐 Security</h3>
        <div id="securityStatus" class="status">Loading...</div>
        <a href="security-report/bandit-report.html">View Report</a>
    </div>

    <!-- Dependency -->
    <div class="card">
        <h3>📦 Dependency</h3>
        <div id="dependencyStatus" class="status">Loading...</div>
        <a href="dependency-report/dependency-report.html">View Report</a>
    </div>

</div>

<footer>
    © 2026 CI/CD Dashboard • GitHub Actions Pipeline
</footer>

<script>
fetch('status.json')
    .then(res => res.json())
    .then(data => {

        function setStatus(id, value) {
            const el = document.getElementById(id)

            if (value === "passed") {
                el.innerHTML = "✔ Passed"
                el.className = "status success"
            } else if (value === "warning") {
                el.innerHTML = "⚠ Warning"
                el.className = "status warning"
            } else {
                el.innerHTML = "❌ Failed"
                el.className = "status danger"
            }
        }

        setStatus("testStatus", data.tests)
        setStatus("lintStatus", data.lint)
        setStatus("securityStatus", data.security)
        setStatus("dependencyStatus", data.dependency)

        // Coverage
        document.getElementById("coverageStatus").innerHTML =
            "✔ " + data.coverage + "%";
        document.getElementById("coverageStatus").className = "status success";

        // Timestamp
        document.getElementById("lastUpdated").innerText =
            "Last updated: " + new Date().toLocaleString();
    })
    .catch(() => {
        document.getElementById("lastUpdated").innerText =
            "⚠ Unable to load status.json";
    });
</script>

</body>
</html>
