name: FastAPI CI/CD Pipeline
'on': workflow_dispatch
env:
  IMAGE_NAME: fastapi-app
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html
          # pytest → Runs your test cases
          # pytest-cov → Measures how much of your code is covered by tests
          # pytest-html → Generates a readable HTML report of test results
      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80
      - name: Extract Coverage %
        run: >
          # Run an inline Python script inside the shell

          python <<EOF

          import xml.etree.ElementTree as ET # Used to parse XML files

          import json # Used to create/update JSON status file

          # Parse the coverage.xml file generated by pytest-cov

          tree = ET.parse("coverage.xml")

          root = tree.getroot()

          # Extract the line coverage rate (value between 0 and 1)

          # Convert it into percentage (0–100)

          coverage = float(root.attrib.get("line-rate", 0)) * 100

          # Create a centralized status file for the pipeline

          # This file will be updated in later stages (lint, security,
          dependency scan)

          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",    # Mark tests as passed
                  "coverage": round(coverage, 2), # Store coverage with 2 decimal precision
                  "lint": "unknown", # Placeholder (updated in lint stage)
                  "security": "unknown",  # Placeholder (updated in security stage)
                  "dependency": "unknown"  # Placeholder (updated in dependency scan)
              }, f)
          EOF
      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: >
            report.xml   # JUnit test results (machine-readable, used by CI
            tools)

            report.html  # Human-readable HTML test report

            coverage.xml  # Coverage data in XML format (used for parsing)

            htmlcov/      # Full HTML coverage report directory

            status.json   # Central pipeline status file (shared across stages)
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Linter
        run: pip install flake8 flake8-html
      - name: Run Lint
        run: >
          flake8 . --format=html --htmldir=flake8-report || true

          # Run flake8 and generate an HTML report in 'flake8-report' directory


          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n
          1)
              # Run flake8 again to count total number of errors
              # --count prints total issues
              # --max-line-length=120 sets allowed line length
              # 2>/dev/null hides warnings/errors from output
              # tail -n 1 extracts only the final count value
          # Inline Python script to update shared pipeline status

          python <<EOF

          import json

          # Load existing status file generated in test stage

          with open("status.json") as f:
              status = json.load(f)
          # Convert error count to integer safely

          try:
              errors = int("$ERRORS".strip())
          except:
              errors = 1
            # Update lint status:
            # - "passed" if no errors
            # - "warning" if any issues found
          status["lint"] = "warning" if errors > 0 else "passed"

          # Save updated status back to file for next stages

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report # HTML lint report directory
            status.json   # Updated pipeline status file
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lint-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json

          with open("status.json") as f:
              status = json.load(f)

          data = json.load(open("bandit-report.json"))
          issues = data.get("results", [])

          status["security"] = "passed" if len(issues) == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.*
            status.json
  dependency-scan:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: security-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Dependencies + pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit
      - name: Run Dependency Scan
        run: >
          pip-audit -r requirements.txt -f json -o dependency-report.json ||
          true


          python <<EOF

          import json


          with open("status.json") as f:
              status = json.load(f)

          data = json.load(open("dependency-report.json"))


          vulns = sum(len(dep.get("vulns", [])) for dep in
          data.get("dependencies", []))


          status["dependency"] = "passed" if vulns == 0 else "warning"


          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF
      - name: Generate HTML Report
        run: |
          python <<EOF
          import json

          data = json.load(open("dependency-report.json"))

          rows = ""

          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  rows += f"<tr><td>{dep.get('name')}</td><td>{dep.get('version')}</td><td>{v.get('id')}</td><td>{v.get('description')}</td></tr>"

          if rows == "":
              rows = "<tr><td colspan='4'>✅ No vulnerabilities found</td></tr>"

          html = f"""
          <html>
          <head>
              <title>Dependency Scan Report</title>
          </head>
          <body>
              <h1>Dependency Scan (pip-audit)</h1>
              <table border="1">
                  <tr><th>Package</th><th>Version</th><th>Vulnerability</th><th>Description</th></tr>
                  {rows}
              </table>
          </body>
          </html>
          """

          with open("dependency-report.html", "w") as f:
              f.write(html)
          EOF
      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.*
            status.json
  deploy-report:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
      - name: Prepare Site
        run: |
          mkdir -p site

          cp reports/index.html site/index.html
          touch site/.nojekyll

          mkdir -p site/test-report
          mkdir -p site/lint-report
          mkdir -p site/security-report
          mkdir -p site/dependency-report

          cp -r test-report/* site/test-report/ || true
          cp -r lint-report/* site/lint-report/ || true
          cp -r security-report/* site/security-report/ || true
          cp -r dependency-report/* site/dependency-report/ || true

          cp dependency-report/status.json site/status.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./site
          force_orphan: true
  build-and-push:
    runs-on: ubuntu-latest
    needs: dependency-scan
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
      - name: Set Image Tag
        run: >
          echo "IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/fastapi-app:${{
          github.sha }}" >> $GITHUB_ENV

          echo "LATEST=${{ secrets.ACR_NAME }}.azurecr.io/fastapi-app:latest" >>
          $GITHUB_ENV
      - name: Build Image
        run: |
          docker build -t $IMAGE .
      - name: Tag Latest
        run: |
          docker tag $IMAGE $LATEST
      - name: Push Image
        run: |
          docker push $IMAGE
          docker push $LATEST
