name: AI DevOps Deployment Pipeline

on:
  workflow_dispatch:

env:
  IMAGE_NAME: fastapi-app
  SECRET_KEY: testsecretkey
  APP_USERNAME: admin
  APP_PASSWORD: admin123

jobs:
  # =====================================================
  # 1. TEST STAGE
  # =====================================================
  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html || true

      - name: Run Tests
        run: |
          pytest --junitxml=report.xml --cov=app --cov-report=xml --cov-report=html --html=report.html --self-contained-html --cov-fail-under=80

      - name: Extract Coverage
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          coverage = float(root.attrib.get("line-rate", 0)) * 100
          with open("status.json", "w") as f:
              json.dump({"tests": "passed", "coverage": round(coverage, 2), "lint": "unknown", "security": "unknown", "dependency": "unknown"}, f)
          EOF

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.html
            status.json

  # =====================================================
  # 2. LINT STAGE
  # =====================================================
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-report
      - name: Run Lint
        run: |
          pip install flake8 flake8-html
          flake8 . --format=html --htmldir=lint-report || true
          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)
          python <<EOF
          import json
          status = json.load(open("status.json"))
          status["lint"] = "passed" if int("$ERRORS".strip() or 0) == 0 else "warning"
          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            lint-report
            status.json

  # =====================================================
  # 3. SECURITY STAGE
  # =====================================================
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lint-report
      - name: Run Security Scan
        run: |
          pip install bandit
          bandit -r app/ -f html -o bandit-report.html || true
          bandit -r app/ -f json -o bandit-report.json || true
          python <<EOF
          import json
          status = json.load(open("status.json"))
          data = json.load(open("bandit-report.json"))
          status["security"] = "passed" if len(data.get("results", [])) == 0 else "warning"
          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.html
            status.json

  # =====================================================
  # 4. DEPENDENCY SCAN
  # =====================================================
  dependency-scan:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: security-report
      - name: Run Dependency Scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt > dependency-report.txt || true
          pip-audit -r requirements.txt -f json -o dependency-report.json || true
          python <<EOF
          import json
          status = json.load(open("status.json"))
          data = json.load(open("dependency-report.json"))
          vulns = sum(len(dep.get("vulns", [])) for dep in data.get("dependencies", []))
          status["dependency"] = "passed" if vulns == 0 else "warning"
          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Dependency Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.txt
            status.json

  # =====================================================
  # 5. AI ANALYSIS & GATE
  # =====================================================
  ai-analysis:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dependency-report
      - name: Call AI Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          INPUT=$(cat status.json)
          JSON_PAYLOAD=$(jq -n --arg text "Analyze results: $INPUT. Return ONLY JSON: {\"risk\": \"LOW|HIGH\", \"decision\": \"ALLOW|BLOCK\", \"reason\": \"string\"}" '{model: "gpt-4o", messages: [{role: "user", content: $text}]}')
          curl https://api.openai.com/v1/chat/completions -s -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d "$JSON_PAYLOAD" > ai-response.json
          
          python <<EOF
          import json
          try:
              res = json.load(open("ai-response.json"))
              content = res['choices'][0]['message']['content']
              with open("ai-report.txt", "w") as f: f.write(content)
              if "BLOCK" in content.upper(): exit(1)
          except Exception as e:
              with open("ai-report.txt", "w") as f: f.write(f"AI Gate Error: {str(e)}")
          EOF

      - name: Upload AI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-decision
          path: ai-report.txt

  # =====================================================
  # 6. BUILD & PUSH (Only if AI Approves)
  # =====================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: ai-analysis
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build & Push
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 7. DEPLOY TO WEB APP
  # =====================================================
  deploy-to-webapp:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 8. DEPLOY DASHBOARD (Final Step - Fixed Paths)
  # =====================================================
  deploy-report:
    runs-on: ubuntu-latest
    needs: [test, lint, security, dependency-scan, ai-analysis]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      
      - name: Prepare Dashboard
        run: |
          mkdir -p site/test-report site/lint-report site/security-report site/dependency-report site/ai-report
          
          # Since you said index.html is under 'reports', we copy it from there to the root of 'site'
          cp reports/index.html site/index.html || cp index.html site/index.html
          
          touch site/.nojekyll
          
          # Move artifacts to folders
          cp test-report/report.html site/test-report/ || true
          
          # Lint report folder handling
          if [ -d "lint-report/lint-report" ]; then
            cp -r lint-report/lint-report/* site/lint-report/ || true
          else
            cp -r lint-report/* site/lint-report/ || true
          fi
          
          cp security-report/bandit-report.html site/security-report/ || true
          cp dependency-report/dependency-report.txt site/dependency-report/ || true
          cp ai-decision/ai-report.txt site/ai-report/ || true
          
          # Final status.json sync
          cp dependency-report/status.json site/status.json || cp test-report/status.json site/status.json || true

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
