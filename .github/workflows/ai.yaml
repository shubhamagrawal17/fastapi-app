name: AI DevOps Deployment Pipeline

on:
  workflow_dispatch:

env:
  IMAGE_NAME: fastapi-app
  SECRET_KEY: testsecretkey
  APP_USERNAME: admin
  APP_PASSWORD: admin123

jobs:

  # =====================================================
  # 1. TEST STAGE
  # =====================================================

  test:
    runs-on: ubuntu-22.04

    env:
      PYTHONPATH: .

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html coverage || true

      - name: Run Tests
        run: |
          pytest \
            --junitxml=report.xml \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --html=report.html \
            --self-contained-html \
            --cov-fail-under=80

      - name: Generate Coverage Summary
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json

          tree = ET.parse("coverage.xml")
          root = tree.getroot()

          coverage = float(root.attrib.get("line-rate", 0)) * 100

          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.html
            htmlcov
            coverage.xml
            report.xml
            status.json

  # =====================================================
  # 2. LINT STAGE
  # =====================================================

  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: artifacts/test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Dependencies
        run: |
          pip install flake8 flake8-html

      - name: Run Lint
        run: |

          mkdir -p lint-report

          flake8 . \
            --format=html \
            --htmldir=lint-report || true

          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)

          cp artifacts/test-report/status.json .

          python <<EOF
          import json

          status = json.load(open("status.json"))

          try:
              errors = int("${ERRORS}".strip())
          except:
              errors = 0

          status["lint"] = "passed" if errors == 0 else "warning"

          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            lint-report
            status.json

  # =====================================================
  # 3. SECURITY STAGE
  # =====================================================

  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: artifacts/lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          pip install bandit

      - name: Run Security Scan
        run: |

          bandit -r app/ -f html -o bandit-report.html || true
          bandit -r app/ -f json -o bandit-report.json || true

          cp artifacts/lint-report/status.json .

          python <<EOF
          import json

          status = json.load(open("status.json"))

          try:
              data = json.load(open("bandit-report.json"))
              issues = len(data.get("results", []))
          except:
              issues = 0

          status["security"] = "passed" if issues == 0 else "warning"

          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.html
            bandit-report.json
            status.json

  # =====================================================
  # 4. DEPENDENCY SCAN
  # =====================================================

  dependency-scan:
    runs-on: ubuntu-latest
    needs: security

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-report
          path: artifacts/security-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency Scanner
        run: |
          pip install pip-audit

      - name: Run Dependency Scan
        run: |

          pip-audit -r requirements.txt -f json -o dependency-report.json || true
          pip-audit -r requirements.txt > dependency-report.txt || true

          python <<EOF
          import json

          try:
              data = json.load(open("dependency-report.json"))
              vulns = sum(
                  len(dep.get("vulns", []))
                  for dep in data.get("dependencies", [])
              )
          except:
              vulns = 0

          html = f"""
          <html>
          <head>
            <title>Dependency Scan Report</title>

            <style>
              body {{
                font-family: Arial;
                background: #0f172a;
                color: white;
                padding: 30px;
              }}

              .card {{
                background: #1e293b;
                padding: 25px;
                border-radius: 12px;
              }}

              pre {{
                white-space: pre-wrap;
                line-height: 1.6;
              }}
            </style>
          </head>

          <body>

            <div class="card">

              <h1>📦 Dependency Scan Report</h1>

              <h2>Total Vulnerabilities: {vulns}</h2>

              <pre>{open('dependency-report.txt').read()}</pre>

            </div>

          </body>
          </html>
          """

          with open("dependency-report.html", "w") as f:
              f.write(html)
          EOF

          cp artifacts/security-report/status.json status.json

          python <<EOF
          import json

          status = json.load(open("status.json"))

          try:
              data = json.load(open("dependency-report.json"))
              vulns = sum(
                  len(dep.get("vulns", []))
                  for dep in data.get("dependencies", [])
              )
          except:
              vulns = 0

          status["dependency"] = "passed" if vulns == 0 else "warning"

          json.dump(status, open("status.json", "w"))
          EOF

      - name: Upload Dependency Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.txt
            dependency-report.json
            dependency-report.html
            status.json

  # =====================================================
  # 5. AI ANALYSIS
  # =====================================================

  # =====================================================
# 5. AI ANALYSIS
# =====================================================

ai-analysis:
  runs-on: ubuntu-latest

  needs: dependency-scan

  steps:

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: dependency-report
        path: artifacts/dependency-report

    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Call AI Engine
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      run: |

        cp artifacts/dependency-report/status.json .

        INPUT=$(cat status.json)

        JSON_PAYLOAD=$(jq -n \
          --arg text "Analyze the CI/CD pipeline results and return ONLY valid raw JSON without markdown or code blocks. Format: {\"risk\":\"LOW|MEDIUM|HIGH\",\"decision\":\"ALLOW|BLOCK\",\"reason\":\"text\"}. Data: $INPUT" \
          '{
            model: "gpt-4o",
            messages: [
              {
                role: "user",
                content: $text
              }
            ]
          }')

        curl https://api.openai.com/v1/chat/completions \
          -s \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD" > ai-response.json

        python <<EOF
        import json

        try:

            res = json.load(open("ai-response.json"))

            content = res["choices"][0]["message"]["content"]

            content = (
                content
                .replace("```json", "")
                .replace("```", "")
                .strip()
            )

            parsed = json.loads(content)

            risk = parsed.get("risk", "UNKNOWN")
            decision = parsed.get("decision", "UNKNOWN")
            reason = parsed.get("reason", "No reason provided")

            with open("risk.txt", "w") as f:
                f.write(risk)

            with open("decision.txt", "w") as f:
                f.write(decision)

            with open("reason.txt", "w") as f:
                f.write(reason)

            formatted = (
                f"AI Deployment Decision\\n\\n"
                f"Risk      : {risk}\\n"
                f"Decision  : {decision}\\n\\n"
                f"Reason:\\n"
                f"{reason}\\n"
            )

            with open("ai-report.txt", "w") as f:
                f.write(formatted)

            print("AI analysis completed successfully")

        except Exception as e:

            error_message = f"AI Parsing Error: {str(e)}"

            with open("ai-report.txt", "w") as f:
                f.write(error_message)

            with open("risk.txt", "w") as f:
                f.write("UNKNOWN")

            with open("decision.txt", "w") as f:
                f.write("BLOCK")

            with open("reason.txt", "w") as f:
                f.write(error_message)

            print(error_message)

        EOF

        RISK=$(cat risk.txt)
        DECISION=$(cat decision.txt)
        REASON=$(cat reason.txt)

        RISK_COLOR="#10b981"

        if [ "$RISK" = "MEDIUM" ]; then
          RISK_COLOR="#f59e0b"
        fi

        if [ "$RISK" = "HIGH" ]; then
          RISK_COLOR="#ef4444"
        fi

        cat <<HTML > ai-report.html
        <!DOCTYPE html>
        <html lang="en">
        
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AI Deployment Analysis</title>
        
          <style>
        
            body {
              margin: 0;
              padding: 40px;
              background: #0f172a;
              color: white;
              font-family: Arial, sans-serif;
            }
        
            .container {
              max-width: 900px;
              margin: auto;
            }
        
            .card {
              background: #1e293b;
              border-radius: 16px;
              padding: 30px;
              border: 1px solid rgba(255,255,255,0.08);
            }
        
            .risk {
              font-size: 28px;
              font-weight: bold;
              color: ${RISK_COLOR};
              margin-top: 20px;
            }
        
            .reason {
              margin-top: 30px;
              line-height: 1.8;
              background: rgba(255,255,255,0.03);
              padding: 20px;
              border-radius: 10px;
              color: #cbd5e1;
            }
        
          </style>
        
        </head>
        
        <body>
        
          <div class="container">
        
            <div class="card">
        
              <h1>🤖 AI Deployment Analysis</h1>
        
              <div class="risk">
                Risk Level: ${RISK}
              </div>
        
              <h2>Deployment Decision: ${DECISION}</h2>
        
              <div class="reason">
                <strong>AI Reasoning:</strong>
                <br><br>
                ${REASON}
              </div>
        
            </div>
        
          </div>
        
        </body>
        </html>
        HTML
        
            - name: Upload AI Artifacts
              uses: actions/upload-artifact@v4
        
              with:
                name: ai-decision
        
                path: |
                  ai-report.txt
                  ai-report.html
                  ai-response.json
                  risk.txt
                  decision.txt
                  reason.txt
  # =====================================================
  # 6. DEPLOYMENT GATE
  # =====================================================

  deployment-gate:
    runs-on: ubuntu-latest
    needs: ai-analysis

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: ai-decision
          path: artifacts/ai-decision

      - name: Validate AI Decision
        run: |

          echo "Reading AI deployment report..."

          cat artifacts/ai-decision/ai-report.txt

          if grep -iq "Decision  : BLOCK" artifacts/ai-decision/ai-report.txt; then

            echo "❌ Deployment blocked by AI"
            exit 1

          fi

          echo "✅ Deployment approved by AI"

  # =====================================================
  # 7. BUILD & PUSH
  # =====================================================

  build-and-push:
    runs-on: ubuntu-latest
    needs: deployment-gate

    permissions:
      id-token: write
      contents: read

    steps:

      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & Push
        run: |

          az acr login --name ${{ secrets.ACR_NAME }}

          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }} .

          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 8. DEPLOY TO WEB APP
  # =====================================================

  deploy-to-webapp:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 9. DEPLOY REPORT DASHBOARD
  # =====================================================

  deploy-report:
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan
      - ai-analysis

    if: always()

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Dashboard
        run: |

          mkdir -p site

          mkdir -p site/test-report
          mkdir -p site/coverage-report
          mkdir -p site/lint-report
          mkdir -p site/security-report
          mkdir -p site/dependency-report
          mkdir -p site/ai-report

          touch site/.nojekyll

          cp reports/index.html site/index.html || cp index.html site/index.html

          cp artifacts/test-report/report.html site/test-report/ || true

          cp -r artifacts/test-report/htmlcov/* site/coverage-report/ || true

          cp -r artifacts/lint-report/lint-report/* site/lint-report/ || true

          cp artifacts/security-report/bandit-report.html site/security-report/ || true

          cp artifacts/dependency-report/dependency-report.html site/dependency-report/ || true

          cp artifacts/ai-decision/ai-report.html site/ai-report/ || true
          cp artifacts/ai-decision/ai-report.txt site/ai-report/ || true

          cp artifacts/dependency-report/status.json site/status.json || true

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
