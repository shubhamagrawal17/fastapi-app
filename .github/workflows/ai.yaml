name: AI DevOps Deployment Pipeline

on:
  workflow_dispatch:

env:
  IMAGE_NAME: fastapi-app
  SECRET_KEY: testsecretkey
  APP_USERNAME: admin
  APP_PASSWORD: admin123

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # =====================================================
  # 1. TEST STAGE
  # =====================================================
  test:
    runs-on: ubuntu-22.04

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html coverage

      - name: Run Tests
        run: |
          pytest \
            --junitxml=report.xml \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --html=report.html \
            --self-contained-html \
            --cov-fail-under=80 || true

      - name: Generate Coverage Summary
        run: |
          python <<'EOF'
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse("coverage.xml")
              root = tree.getroot()
              coverage = float(root.attrib.get("line-rate", 0)) * 100
          except Exception:
              coverage = 0

          with open("status.json", "w") as f:
              json.dump({
                  "tests": "completed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.html
            htmlcov
            coverage.xml
            report.xml
            status.json

  # =====================================================
  # 2. LINT STAGE
  # =====================================================
  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Dependencies
        run: pip install flake8 flake8-html

      - name: Run Lint
        env:
          MAX_LINE: 120
        run: |
          mkdir -p lint-report-dir

          # Generate HTML lint report
          flake8 . \
            --max-line-length=$MAX_LINE \
            --format=html \
            --htmldir=lint-report-dir || true

          # Save full flake8 output
          flake8 . \
            --max-line-length=$MAX_LINE \
            > flake8-output.txt || true

          # Count ONLY lint issue lines
          ERR_COUNT=$(grep -E ":[0-9]+:[0-9]+:" flake8-output.txt | wc -l)

          # Store clean numeric value
          echo "FLAKE_ERRORS=$ERR_COUNT" >> $GITHUB_ENV

          echo "Total flake8 issues: $ERR_COUNT"

      - name: Update Status
        env:
          ERRORS: ${{ env.FLAKE_ERRORS }}
        run: |
          python <<'EOF'
          import json
          import os

          status = json.load(open("status.json"))

          try:
              errors = int(os.getenv("ERRORS", "0"))
          except ValueError:
              errors = 0

          status["lint"] = "passed" if errors == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            lint-report-dir
            flake8-output.txt
            status.json

  # =====================================================
  # 3. SECURITY STAGE
  # =====================================================
  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Lint Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f html -o bandit-report.html || true
          bandit -r app/ -f json -o bandit-report.json || true

          python <<'EOF'
          import json

          status = json.load(open("status.json"))

          try:
              data = json.load(open("bandit-report.json"))
              issues = len(data.get("results", []))
          except Exception:
              issues = 0

          status["security"] = "passed" if issues == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.html
            bandit-report.json
            status.json

  # =====================================================
  # 4. DEPENDENCY SCAN
  # =====================================================
  dependency-scan:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency Scanner
        run: pip install pip-audit

      - name: Run Dependency Scan
        run: |
          pip-audit -r requirements.txt -f json -o dependency-report.json || true
          pip-audit -r requirements.txt > dependency-report.txt || true

          python <<'EOF'
          import json

          status = json.load(open("status.json"))

          try:
              data = json.load(open("dependency-report.json"))
              vulns = sum(
                  len(dep.get("vulns", []))
                  for dep in data.get("dependencies", [])
              )
          except Exception:
              vulns = 0

          with open("dependency-report.html", "w") as f:
              f.write(f"""
              <html>
                <body style="background:#0f172a;color:white;font-family:Arial;padding:20px;">
                  <h1>Dependency Scan Report</h1>
                  <h2>Total Vulnerabilities: {vulns}</h2>
                </body>
              </html>
              """)

          status["dependency"] = "passed" if vulns == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Dependency Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.json
            dependency-report.txt
            dependency-report.html
            status.json

  # =====================================================
  # 5. AI ANALYSIS
  # =====================================================
  ai-analysis:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Dependency Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dependency-report
          path: .

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Call AI Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          INPUT=$(cat status.json)

          JSON_PAYLOAD=$(jq -n \
            --arg text "Analyze this CI/CD pipeline result and return ONLY valid raw JSON in this exact format: {\"risk\":\"LOW|HIGH\",\"decision\":\"ALLOW|BLOCK\",\"reason\":\"text\"}. Input: $INPUT" \
            '{
              model: "gpt-4o",
              messages: [
                {
                  role: "user",
                  content: $text
                }
              ]
            }')

          curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" > ai-response.json

          python <<'EOF'
          import json

          try:
              res = json.load(open("ai-response.json"))

              content = (
                  res["choices"][0]["message"]["content"]
                  .replace("```json", "")
                  .replace("```", "")
                  .strip()
              )

              parsed = json.loads(content)

              for key in ["risk", "decision", "reason"]:
                  with open(f"{key}.txt", "w") as f:
                      f.write(str(parsed.get(key, "UNKNOWN")))

          except Exception:
              defaults = {
                  "risk": "HIGH",
                  "decision": "BLOCK",
                  "reason": "AI analysis failed"
              }

              for key, value in defaults.items():
                  with open(f"{key}.txt", "w") as f:
                      f.write(value)
          EOF

      - name: Create HTML Report
        run: |
          RISK=$(cat risk.txt)
          DECISION=$(cat decision.txt)
          REASON=$(cat reason.txt)

          cat <<EOF > ai-report.html
          <html>
            <body style="background:#1e293b;color:white;font-family:Arial;padding:20px;">
              <h1>AI Deployment Decision</h1>
              <h2>Decision: $DECISION</h2>
              <h3>Risk Level: $RISK</h3>
              <p>$REASON</p>
            </body>
          </html>
          EOF

      - name: Upload AI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-decision
          path: |
            ai-report.html
            decision.txt
            risk.txt
            reason.txt

  # =====================================================
  # 6. DEPLOYMENT GATE
  # =====================================================
  deployment-gate:
    runs-on: ubuntu-latest
    needs: ai-analysis

    steps:
      - name: Download AI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ai-decision
          path: .

      - name: Validate AI Decision
        run: |
          DECISION=$(cat decision.txt)

          if [ "$DECISION" = "BLOCK" ]; then
            echo "❌ Deployment blocked by AI"
            exit 1
          fi

          echo "✅ Deployment approved"

  # =====================================================
  # 7. BUILD & PUSH
  # =====================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: deployment-gate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Docker Image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }} .

          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 8. DEPLOY TO WEB APP
  # =====================================================
  deploy-to-webapp:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  # =====================================================
  # 9. DEPLOY REPORT DASHBOARD
  # =====================================================
  deploy-report:
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - security
      - dependency-scan
      - ai-analysis

    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Dashboard
        run: |
          mkdir -p \
            site/test-report \
            site/lint-report \
            site/security-report \
            site/dependency-report \
            site/ai-report

          touch site/.nojekyll

          cp artifacts/test-report/report.html site/test-report/ || true
          cp -r artifacts/test-report/htmlcov/* site/test-report/ || true

          cp -r artifacts/lint-report/lint-report-dir/* site/lint-report/ || true

          cp artifacts/security-report/bandit-report.html site/security-report/ || true

          cp artifacts/dependency-report/dependency-report.html site/dependency-report/ || true

          cp artifacts/ai-decision/ai-report.html site/ai-report/ || true
          cp artifacts/ai-decision/risk.txt site/ai-report/ || true
          cp artifacts/ai-decision/reason.txt site/ai-report/ || true
          cp artifacts/ai-decision/decision.txt site/ai-report/ || true

          cat <<EOF > site/index.html
          <html>
            <body style="background:#0f172a;color:white;font-family:Arial;padding:40px;">
              <h1>AI DevOps Dashboard</h1>

              <ul>
                <li><a href="./test-report/report.html">Test Report</a></li>
                <li><a href="./lint-report/index.html">Lint Report</a></li>
                <li><a href="./security-report/bandit-report.html">Security Report</a></li>
                <li><a href="./dependency-report/dependency-report.html">Dependency Report</a></li>
                <li><a href="./ai-report/ai-report.html">AI Decision Report</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
