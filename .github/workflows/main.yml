# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json 

name: FastAPI CI/CD Pipeline 🚀

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: fastapi-app

jobs:

  # =========================
  # 🧪 TEST STAGE
  # =========================
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Tests
        run: |
          pytest \
            --junitxml=report.xml \
            --cov=app \
            --cov-report=xml \
            --html=report.html \
            --self-contained-html

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.*

  # =========================
  # 🧹 LINT STAGE
  # =========================
  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          flake8 . --format=github || true
          flake8 . --format=html --htmldir=flake8-report || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: flake8-report

  # =========================
  # 🔐 SECURITY SCAN
  # =========================
  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.*

  # =========================
  # 📦 DEPENDENCY SCAN
  # =========================
  dependency-scan:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Dependency Scan
        run: |
          pip-audit -r requirements.txt -f json -o dependency-report.json || true

      - name: Convert JSON → HTML
        run: |
          python <<EOF
          import json

          with open("dependency-report.json") as f:
              data = json.load(f)

          deps = data.get("dependencies", [])

          html = "<html><body><h1>Dependency Report</h1><table border='1'>"
          html += "<tr><th>Package</th><th>Version</th><th>Status</th></tr>"

          for dep in deps:
              name = dep.get("name")
              version = dep.get("version")
              vulns = dep.get("vulns", [])

              if vulns:
                  html += f"<tr><td>{name}</td><td>{version}</td><td>Vulnerable</td></tr>"
              else:
                  html += f"<tr><td>{name}</td><td>{version}</td><td>Safe</td></tr>"

          html += "</table></body></html>"

          with open("dependency-report.html", "w") as f:
              f.write(html)
          EOF

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.*

  # =========================
  # 🐳 BUILD & PUSH
  # =========================
  build-and-push:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag Latest
        run: |
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  # =========================
  # 🌍 DEPLOY REPORT DASHBOARD
  # =========================
  deploy-report:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Site
        run: |
          mkdir site
          cp -r test-report/* site/ || true
          cp -r lint-report/* site/ || true
          cp -r security-report/* site/ || true
          cp -r dependency-report/* site/ || true
          cp -r reports/* site/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
