# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: FastAPI CI/CD Pipeline 🚀

on: workflow_dispatch

env:
  IMAGE_NAME: fastapi-app

jobs:

# =========================
# 🧪 TEST STAGE
# =========================
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80

      - name: Extract Coverage %
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          coverage = float(root.attrib.get("line-rate", 0)) * 100

          import json
          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            report.html
            coverage.xml
            htmlcov/
            status.json


# =========================
# 🧹 LINT STAGE
# =========================
  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          flake8 . --format=html --htmldir=flake8-report || true
      
          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)
      
          echo "Flake8 Errors: $ERRORS"
      
          python <<EOF
          import json
      
          with open("status.json") as f:
              status = json.load(f)
      
          try:
              errors = int("$ERRORS")
          except:
              errors = 1
      
          status["lint"] = "warning" if errors > 0 else "passed"
      
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report
            status.json


# =========================
# 🔐 SECURITY SCAN
# =========================
  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json

          with open("status.json") as f:
              status = json.load(f)

          data = json.load(open("bandit-report.json"))
          issues = data.get("results", [])

          status["security"] = "passed" if len(issues) == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.*
            status.json


# =========================
# 📦 DEPENDENCY SCAN
# =========================
dependency-scan:
runs-on: ubuntu-latest
needs: security

steps:
  - uses: actions/checkout@v4

  - uses: actions/download-artifact@v4
    with:
      name: security-report

  # Install Trivy
  - name: Install Trivy
    run: |
      sudo apt-get update
      sudo apt-get install -y wget
      wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.0_Linux-64bit.deb
      sudo dpkg -i trivy_0.50.0_Linux-64bit.deb

  # Run scan (filesystem = your repo, including requirements.txt)
  - name: Run Dependency Scan (Trivy)
    run: |
      trivy fs . --format json -o dependency-report.json || true

      python <<EOF
      import json

      with open("status.json") as f:
          status = json.load(f)

      data = json.load(open("dependency-report.json"))

      severity = "passed"

      for result in data.get("Results", []):
          for vuln in result.get("Vulnerabilities", []):
              sev = vuln.get("Severity", "").upper()

              if sev in ["CRITICAL", "HIGH"]:
                  severity = "danger"
                  break
              elif sev == "MEDIUM" and severity != "danger":
                  severity = "warning"

          if severity == "danger":
              break

      status["dependency"] = severity

      with open("status.json", "w") as f:
          json.dump(status, f)
      EOF

  # Generate HTML report
  - name: Generate HTML Report
    run: |
      python <<EOF
      import json

      data = json.load(open("dependency-report.json"))

      rows = ""

      for result in data.get("Results", []):
          for v in result.get("Vulnerabilities", []):
              rows += f"<tr><td>{v.get('PkgName')}</td><td>{v.get('InstalledVersion')}</td><td>{v.get('Severity')}</td><td>{v.get('Title')}</td></tr>"

      html = f"""
      <html>
      <head>
          <title>Dependency Scan Report</title>
          <style>
              body {{ font-family: Arial; padding: 20px; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #ccc; padding: 8px; }}
              th {{ background: #f4f4f4; }}
          </style>
      </head>
      <body>
          <h1>Dependency Scan (Trivy)</h1>
          <table>
              <tr><th>Package</th><th>Version</th><th>Severity</th><th>Issue</th></tr>
              {rows}
          </table>
      </body>
      </html>
      """

      with open("dependency-report.html", "w") as f:
          f.write(html)
      EOF

  - name: Upload Dependency Reports
    uses: actions/upload-artifact@v4
    with:
      name: dependency-report
      path: |
        dependency-report.*
        status.json

# =========================
# 🌍 DEPLOY REPORT DASHBOARD
# =========================
  deploy-report:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Site
        run: |
          mkdir -p site

          cp reports/index.html site/index.html
          touch site/.nojekyll

          mkdir -p site/test-report
          mkdir -p site/lint-report
          mkdir -p site/security-report
          mkdir -p site/dependency-report

          cp -r test-report/* site/test-report/ || true
          cp -r lint-report/* site/lint-report/ || true
          cp -r security-report/* site/security-report/ || true
          cp -r dependency-report/* site/dependency-report/ || true

          # FINAL STATUS FILE
          cp dependency-report/status.json site/status.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
