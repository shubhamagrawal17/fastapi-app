# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: FastAPI CI/CD Pipeline 🚀

on: workflow_dispatch
  #workflow_dispatch:
  #push:
    #branches: [ main ]

env:
  IMAGE_NAME: fastapi-app

jobs:

# =========================
# 🧪 TEST STAGE
# =========================
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80 || true

      - name: Extract Coverage %
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json
          import os

          coverage = 0
          if os.path.exists("coverage.xml"):
              tree = ET.parse("coverage.xml")
              root = tree.getroot()
              coverage = float(root.attrib.get("line-rate", 0)) * 100

          status = {
              "tests": "passed",
              "coverage": round(coverage, 2),
              "lint": "unknown",
              "security": "unknown",
              "dependency": "unknown"
          }
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            report.html
            coverage.xml
            htmlcov/
            status.json

# =========================
# 🧹 LINT STAGE
# =========================
  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          mkdir -p flake8-report
          flake8 . --format=html --htmldir=flake8-report || true
          ERRORS=$(flake8 . --count --max-line-length=120 || true)

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          
          error_count = int("$ERRORS")
          status["lint"] = "passed" if error_count == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report/
            status.json

# =========================
# 🔐 SECURITY SCAN
# =========================
  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)

          with open("bandit-report.json") as f:
              data = json.load(f)
          
          issues = data.get("results", [])
          status["security"] = "passed" if len(issues) == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.json
            bandit-report.html
            status.json

# =========================
# 📦 DEPENDENCY SCAN
# =========================
  dependency-scan:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Dependency Scan
        run: |
          pip-audit -r requirements.txt -f json -o dependency-report.json || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)

          with open("dependency-report.json") as f:
              data = json.load(f)
          
          vulns = sum(len(dep.get("vulns", [])) for dep in data.get("dependencies", []))
          status["dependency"] = "passed" if vulns == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.json
            status.json

# =========================
# 🌍 DEPLOY REPORT DASHBOARD
# =========================
  deploy-report:
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Site
        run: |
          mkdir -p site
          
          # 1. Copy the main dashboard template
          if [ -f "reports/index.html" ]; then
            cp reports/index.html site/index.html
          else
            echo "Error: reports/index.html not found!"
            exit 1
          fi

          # 2. Copy the final status.json to the root for the dashboard to read
          cp artifacts/dependency-report/status.json site/status.json

          # 3. Organize sub-reports into named folders
          mkdir -p site/test-report site/lint-report site/security-report site/dependency-report
          
          cp -r artifacts/test-report/* site/test-report/ || true
          cp -r artifacts/lint-report/* site/lint-report/ || true
          cp -r artifacts/security-report/* site/security-report/ || true
          cp -r artifacts/dependency-report/* site/dependency-report/ || true

          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
